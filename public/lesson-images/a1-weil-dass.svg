<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#FFFCF0"/>
  <rect width="800" height="450" fill="none" stroke="#D4C18F" stroke-opacity="0.35" stroke-width="2" rx="20"/>
  <text x="400" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="800" letter-spacing="2" fill="#94845C">WEG · B2 — VERLAG FÜR DEUTSCH — A2</text>
  <text x="400" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="900" fill="#0F2A44">weil · dass — Gründe und Aussagen verbinden</text>
  <text x="400" y="100" text-anchor="middle" font-family="system-ui" font-size="14" fill="#1A2E4A">لأن وأن — الجمل التابعة في المستوى A1</text>
  <line x1="80" y1="120" x2="720" y2="120" stroke="#113A5F" stroke-width="2" opacity="0.2"/>
  <g font-family="system-ui" font-size="12"><text x="50" y="280" font-weight="700" fill="#0F2A44">Ich bleibe zu Hause, weil ich müde bin.</text><text x="50" y="298" font-size="11" fill="#666">في الجملة التابعة المعيارية التي يتدرّب عليها الدرس، يذهب الفعل المصرف إلى النهاية: bin في آخر العبارة التابعة.</text><text x="50" y="320" font-weight="700" fill="#0F2A44">Sie sagt, dass sie heute aus Tunesien anruft.</text><text x="50" y="338" font-size="11" fill="#666">dass يقدّم مضمون قول أو معرفة أو اعتقاد (sagen, wissen, glauben)؛ والفعل المصرف يأتي في نهاية التابعة: anruft.</text></g>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui" font-size="9" fill="#A78BFA">Mayer Dual-Coding · Verlag WEG · a1-weil-dass</text>
</svg>