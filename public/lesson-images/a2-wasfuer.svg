  <g font-family="system-ui" font-size="11"><text x="50" y="280" font-weight="800" fill="#113A5F">الحالة</text><text x="170" y="280" font-weight="800" fill="#113A5F">مذكر: der Film</text><text x="290" y="280" font-weight="800" fill="#113A5F">مؤنث: die Tasche</text><text x="410" y="280" font-weight="800" fill="#113A5F">محايد: das Buch</text><text x="530" y="280" font-weight="800" fill="#113A5F">جمع: die Bücher</text><text x="50" y="300" fill="#1A2E4A">Nominativ</text><text x="170" y="300" fill="#1A2E4A">Was für ein Film</text><text x="290" y="300" fill="#1A2E4A">Was für eine Tasche</text><text x="410" y="300" fill="#1A2E4A">Was für ein Buch</text><text x="530" y="300" fill="#1A2E4A">Was für Bücher</text><text x="50" y="318" fill="#1A2E4A">Akkusativ</text><text x="170" y="318" fill="#1A2E4A">Was für einen Film</text><text x="290" y="318" fill="#1A2E4A">Was für eine Tasche</text><text x="410" y="318" fill="#1A2E4A">Was für ein Buch</text><text x="530" y="318" fill="#1A2E4A">Was für Bücher</text><text x="50" y="336" fill="#1A2E4A">Dativ (mit)</text><text x="170" y="336" fill="#1A2E4A">mit was für einem Film</text><text x="290" y="336" fill="#1A2E4A">mit was für einer Tasche</text><text x="410" y="336" fill="#1A2E4A">mit was für einem Buch</text><text x="530" y="336" fill="#1A2E4A">mit was für Büchern</text></g>
