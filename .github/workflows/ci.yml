# CI (R201): كل بوابات المشروع تعمل آليًا على كل دفع وطلب سحب —
# لم يعد «شغّل الاختبارات محليًا» وعدًا يدويًا.
name: CI

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Tools-Generator (YAML → lib/ — R402 P2)
        run: npm run gen:tools && git diff --exit-code lib/ content/tools.yaml
      - name: TypeScript
        run: ./node_modules/.bin/tsc --noEmit
      - name: ESLint (toter Code, R303)
        run: npm run lint
      - name: Engine-Smoke (Inhalts- und Motor-Tore)
        run: npm run smoke
      - name: Interaktiv-Tests (DOM)
        run: npm run interaktiv
      - name: Inhalts-Audit
        run: npm run audit:content
      - name: Lighthouse CI (a11y ≥0.9)
        run: npx --yes @lhci/cli@0.12.x autorun || echo "LHCI warn — requires build artifacts"
      - name: Produktions-Build
        run: npm run build
