# CI (R201/R138/R142): البوابات الكاملة تعمل مرةً لكل طلب سحب ثم مرةً على main بعد الدمج.
# هذا يمنع تشغيل النسخة الثقيلة مرتين لنفس commit على فرع له PR، ويبقي main محروساً.
# إجراءات الطرف الثالث مثبتة على commit SHA كامل؛ Dependabot يقترح تحديثها أسبوعياً.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.3"
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-audio-qc.txt
      - name: Abhängigkeiten ohne Lifecycle-Skripte installieren
        run: npm ci --ignore-scripts
      - name: Tools-Generator (YAML → lib/ + governance summary)
        run: npm run gen:tools && git diff --exit-code lib/ content/tool-catalog-summary.json content/tool-catalog-review-matrix.json content/tools.yaml
      - name: Grammar-Profile-Generator (87 Themen → evidence matrix)
        run: npm run gen:ggp && git diff --exit-code content/grammar-profile-matrix.json
      - name: Repository-Audit (alle getrackten Dateien)
        run: npm run audit:repo
      - name: Plan-Audit (378 Tage, vollständige Aufgabenreferenzen)
        run: npm run audit:plan
      - name: Accreditation-Alignment (Goethe B2 + telc B2، technische Evidenz)
        run: npm run audit:accreditation
      - name: External-Evidence-Dossier (2 sources + 10 reviews + 7 gates)
        run: npm run audit:evidence
      - name: Grammar-Profile (internal matrix; no unsupported GGP claim)
        run: npm run audit:ggp
      - name: Tool-Catalog Governance (820 ideas, evidence lifecycle)
        run: npm run audit:tools
      - name: Real-World Validation Program (no simulated human sign-off)
        run: npm run audit:real-world
      - name: Audio-QC (1099 Dateien neu dekodieren und messen)
        run: npm run audio:qc
      - name: TypeScript
        run: ./node_modules/.bin/tsc --noEmit
      - name: ESLint (toter Code, R303)
        run: npm run lint
      - name: Dependency-Audit (moderate+)
        run: npm run audit:deps
      - name: Engine-Smoke (Inhalts- und Motor-Tore)
        run: npm run smoke
      - name: Interaktiv-Tests (DOM)
        run: npm run interaktiv
      - name: Inhalts-Audit
        run: npm run audit:content
      - name: Reviewed vocabulary morphology (PA-034 regression gate)
        run: npm run audit:vocab-posinfo
      - name: Writing prompt/scoring consistency (PA-035 regression gate)
        run: npm run audit:writing-consistency
      - name: Wort-für-Wort-Audit (bestätigte Blocker)
        run: npm run audit:words
      - name: Scaffold-Observability (CEFR baseline; candidates are not defects)
        run: npm run audit:scaffolds
      - name: Scaffold-Review (B1/B2 item decisions; no simulated expert sign-off)
        run: npm run audit:scaffold-review
      - name: Produktions-Build
        run: npm run build
      - name: Browser-E2E (echtes Chromium, SW + Offline + CSP)
        run: npm run e2e:browser
      - name: Lighthouse CI (9 Hauptseiten، a11y ≥0.9 مانع)
        run: npm run audit:lighthouse
